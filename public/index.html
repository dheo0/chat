<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI 법률 상담</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f2f2f7;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 390px;
      height: 844px;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 40px rgba(0,0,0,0.15);
    }

    @media (max-width: 430px) {
      body {
        align-items: stretch;
        background: #fff;
      }
      .chat-container {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        box-shadow: none;
        border-radius: 0;
      }
    }

    /* 상단 바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 12px;
      padding-top: max(16px, env(safe-area-inset-top));
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .top-bar-title {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-bar button {
      background: none;
      border: none;
      cursor: pointer;
      color: #333;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-bar svg { width: 24px; height: 24px; }

    /* 환영 섹션 */
    .welcome-section {
      padding: 12px 24px 16px;
      background: #fff;
    }

    .avatar-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #e8e8e8;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      overflow: hidden;
    }

    .avatar-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 700;
      color: #111;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .welcome-sub {
      font-size: 14px;
      color: #888;
      line-height: 1.5;
    }

    /* 퀵 버튼 칩 */
    .chips-section {
      padding: 16px 24px 0;
      background: #fff;
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid #ddd;
      background: #fff;
      color: #222;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chip:hover { background: #f5f5f5; }

    .chip.purple {
      background: #7b3ff2;
      border-color: #7b3ff2;
      color: #fff;
    }

    .chip.purple:hover { background: #6a2ee0; }

    .chip.black {
      background: #111;
      border-color: #111;
      color: #fff;
    }

    .chip.black:hover { background: #333; }

    /* 안내 텍스트 */
    .info-row {
      padding: 16px 24px 8px;
      background: #fff;
    }

    .info-text {
      font-size: 13px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .timestamp {
      font-size: 12px;
      color: #ccc;
      margin-top: 4px;
    }

    /* 메시지 영역 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fff;
    }

    .messages::-webkit-scrollbar { width: 0; }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.bot { align-self: flex-start; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .message.bot .bubble {
      background: #f2f2f7;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: #7b3ff2;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* 타이핑 */
    .typing-indicator {
      display: none;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-start;
    }

    .typing-indicator.show { display: flex; }

    .typing-dots {
      background: #f2f2f7;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #bbb;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* 하단 입력바 */
    .input-area {
      padding: 12px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #f0f0f0;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 100;
    }

    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      padding: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .menu-btn svg { width: 22px; height: 22px; }

    #messageInput {
      flex: 1;
      border: 1.5px solid #e8e8e8;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      resize: none;
      font-family: inherit;
      color: #111;
      background: #fafafa;
      max-height: 96px;
      line-height: 1.5;
    }

    #messageInput::placeholder { color: #bbb; }
    #messageInput:focus { border-color: #7b3ff2; background: #fff; }

    #sendBtn {
      width: 40px;
      height: 40px;
      background: #c5c5c5;
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    #sendBtn.active { background: #7b3ff2; }
    #sendBtn:disabled { background: #ddd; cursor: not-allowed; }

    #sendBtn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="chat-container">

    <!-- 상단 바 -->
    <div class="top-bar">
      <button onclick="resetChat()" title="새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 .49-4.95"></path>
        </svg>
      </button>
      <div class="top-bar-title">⚖️ AI 법률상담사</div>
      <button onclick="window.close()" title="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- 환영 섹션 -->
    <div class="welcome-section" id="welcomeSection">
      <div class="avatar-img">⚖️</div>
      <div class="welcome-title">AI 법률상담사<br>무엇을 도와드릴까요?</div>
      <div class="welcome-sub">궁금한 점을 물어보면 빠르게 해결해 드려요.</div>
    </div>

    <!-- 퀵 버튼 -->
    <div class="chips-section" id="chipsSection">
      <div class="chips-row">
        <button class="chip purple" onclick="quickSend('임금 체불 시 어떻게 해야 하나요?')">임금 체불</button>
        <button class="chip black" onclick="quickSend('계약서 검토 시 주의사항을 알려주세요')">계약서 검토</button>
        <button class="chip" onclick="quickSend('이혼 절차에 대해 알려주세요')">이혼 상담</button>
      </div>
      <div class="chips-row">
        <button class="chip" onclick="quickSend('손해배상 청구 방법을 알려주세요')">손해배상</button>
        <button class="chip" onclick="quickSend('부동산 분쟁 해결 방법을 알려주세요')">부동산 분쟁</button>
        <button class="chip" onclick="quickSend('형사 고소 방법을 알려주세요')">형사 고소</button>
      </div>
      <div class="chips-row">
        <button class="chip" onclick="quickSend('노동 관련 법률 상담을 받고 싶어요')">노동 상담</button>
        <button class="chip" onclick="quickSend('법률 구조 서비스에 대해 알려주세요')">법률 구조</button>
      </div>
    </div>

    <!-- 안내 텍스트 -->
    <div class="info-row" id="infoRow">
      <div class="info-text">ⓘ 챗봇 이렇게 써 보세요</div>
      <div class="timestamp" id="initTime"></div>
    </div>

    <!-- 메시지 영역 -->
    <div class="messages" id="messages"></div>

    <!-- 타이핑 인디케이터 -->
    <div class="typing-indicator" id="typingIndicator">
      <div class="msg-avatar">⚖️</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- 입력 영역 -->
    <div class="input-area">
      <button class="menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <textarea id="messageInput" placeholder="궁금한 사항을 입력해 주세요" rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 4l8 8H4l8-8z"/>
        </svg>
      </button>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const welcomeSection = document.getElementById('welcomeSection');
    const chipsSection = document.getElementById('chipsSection');
    const infoRow = document.getElementById('infoRow');

    // 현재 시간 표시
    const now = new Date();
    document.getElementById('initTime').textContent =
      now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

    function hideWelcome() {
      welcomeSection.style.display = 'none';
      chipsSection.style.display = 'none';
      infoRow.style.display = 'none';
    }

    function showWelcome() {
      welcomeSection.style.display = '';
      chipsSection.style.display = '';
      infoRow.style.display = '';
    }

    function appendMessage(text, sender) {
      hideWelcome();
      const isUser = sender === 'user';
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'bot'}`;
      div.innerHTML = `
        ${!isUser ? '<div class="msg-avatar">⚖️</div>' : ''}
        <div class="bubble">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      appendMessage(text, 'user');
      socket.emit('message', text);
      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
      sendBtn.classList.remove('active');
    }

    function quickSend(text) {
      inputEl.value = text;
      updateSendBtn();
      sendMessage();
    }

    function resetChat() {
      socket.emit('reset');
    }

    function updateSendBtn() {
      const hasText = inputEl.value.trim().length > 0;
      sendBtn.disabled = !hasText;
      sendBtn.classList.toggle('active', hasText);
    }

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 96) + 'px';
      updateSendBtn();
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });

    socket.on('typing', (isTyping) => {
      typingIndicator.classList.toggle('show', isTyping);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    socket.on('reply', (text) => {
      sendBtn.disabled = false;
      appendMessage(text, 'bot');
    });

    socket.on('error', (msg) => {
      sendBtn.disabled = false;
      appendMessage(msg, 'bot');
    });

    socket.on('resetDone', () => {
      messagesEl.innerHTML = '';
      showWelcome();
      const t = new Date();
      document.getElementById('initTime').textContent =
        t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');
    });
  </script>
</body>
</html>
