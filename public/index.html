<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1:1 심리 상담 채팅</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 480px;
      height: 700px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #4f7df3;
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-text h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .header-text p {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .reset-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-btn:hover {
      background: rgba(255,255,255,0.35);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #d0d8e8;
      border-radius: 2px;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.bot {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .message.bot .msg-avatar {
      background: #e8eeff;
    }

    .message.user .msg-avatar {
      background: #e8f5e8;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.bot .bubble {
      background: #f0f2f8;
      color: #2d3748;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: #4f7df3;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .typing-indicator {
      display: none;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-start;
    }

    .typing-indicator.show {
      display: flex;
    }

    .typing-dots {
      background: #f0f2f8;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #a0aec0;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 14px 16px;
      border-top: 1px solid #e8ecf4;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    #messageInput {
      flex: 1;
      border: 1.5px solid #d0d8e8;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      outline: none;
      resize: none;
      font-family: inherit;
      transition: border-color 0.2s;
      max-height: 100px;
      line-height: 1.5;
    }

    #messageInput:focus {
      border-color: #4f7df3;
    }

    #sendBtn {
      width: 44px;
      height: 44px;
      background: #4f7df3;
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    #sendBtn:hover:not(:disabled) {
      background: #3a68e0;
    }

    #sendBtn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .welcome-message {
      text-align: center;
      padding: 20px;
      color: #718096;
    }

    .welcome-message .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .welcome-message h3 {
      font-size: 15px;
      margin-bottom: 6px;
      color: #4a5568;
    }

    .welcome-message p {
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="header-info">
        <div class="avatar">🧠</div>
        <div class="header-text">
          <h2>AI 심리 상담사</h2>
          <p>언제든지 편하게 이야기해주세요</p>
        </div>
      </div>
      <button class="reset-btn" onclick="resetChat()">대화 초기화</button>
    </div>

    <div class="messages" id="messages">
      <div class="welcome-message">
        <div class="icon">💬</div>
        <h3>안녕하세요, 상담사입니다</h3>
        <p>오늘 어떤 이야기를 나눠볼까요?<br>편안하게 말씀해 주세요.</p>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
      <div class="msg-avatar">🧠</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="messageInput"
        placeholder="메시지를 입력하세요... (Enter: 전송, Shift+Enter: 줄바꿈)"
        rows="1"
      ></textarea>
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    function appendMessage(text, sender) {
      // 환영 메시지 제거
      const welcome = messagesEl.querySelector('.welcome-message');
      if (welcome) welcome.remove();

      const isUser = sender === 'user';
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'bot'}`;

      div.innerHTML = `
        <div class="msg-avatar">${isUser ? '👤' : '🧠'}</div>
        <div class="bubble">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
      `;

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      socket.emit('message', text);

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
    }

    function resetChat() {
      socket.emit('reset');
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    socket.on('typing', (isTyping) => {
      typingIndicator.classList.toggle('show', isTyping);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    socket.on('reply', (text) => {
      sendBtn.disabled = false;
      appendMessage(text, 'bot');
    });

    socket.on('error', (msg) => {
      sendBtn.disabled = false;
      appendMessage(msg, 'bot');
    });

    socket.on('resetDone', () => {
      messagesEl.innerHTML = `
        <div class="welcome-message">
          <div class="icon">💬</div>
          <h3>대화가 초기화되었습니다</h3>
          <p>새로운 대화를 시작해보세요.</p>
        </div>
      `;
    });
  </script>
</body>
</html>
